# DriftPilot composite action (SPEC §5.1). Runs on the caller's runner, so it uses the Terraform
# installed by hashicorp/setup-terraform (set terraform_wrapper: false so exit codes are raw).
name: DriftPilot
description: Detect Terraform drift and unmanaged resources, and report them in the job summary.
branding:
  icon: compass
  color: blue

inputs:
  working-directory:
    description: Terraform folder to check
    default: "."
  llm-provider:
    description: gemini or ollama (used from v0.2)
    default: gemini
  llm-model:
    description: Model name (used from v0.2; default comes from config)
    default: ""
  llm-api-key:
    description: LLM API key secret (used from v0.2)
    default: ""
  provider-token:
    description: Credentials the Terraform provider and scanners need, passed as GITHUB_TOKEN
    default: ""
  github-token:
    description: Token for opening issues/PRs and pushing history (used from v0.2)
    default: ${{ github.token }}
  mode:
    description: advise (issues/comments only) or open-prs (used from v0.2)
    default: advise
  config-path:
    description: Repo config file
    default: .driftpilot.yml
  history-branch:
    description: Branch where drift history is stored; empty to disable history
    default: driftpilot-data
  dashboard-repo:
    description: Public repo (owner/name) with GitHub Pages to publish the dashboard to; empty = off
    default: ""
  dashboard-token:
    description: Token that can write to dashboard-repo (the workflow token can't write other repos)
    default: ""

outputs:
  drift-found:
    description: "'true' if real drift or unmanaged resources were found"
    value: ${{ steps.scan.outputs.drift-found }}
  critical-count:
    description: Number of critical findings
    value: ${{ steps.scan.outputs.critical-count }}
  finding-count:
    description: Number of real (non-noise) drift findings
    value: ${{ steps.scan.outputs.finding-count }}
  unmanaged-count:
    description: Number of unmanaged resources
    value: ${{ steps.scan.outputs.unmanaged-count }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install DriftPilot
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"

    - name: Scan for drift
      id: scan
      shell: bash
      # Inputs go through env, never straight into the script, so values can't inject shell code.
      env:
        DRIFTPILOT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        DRIFTPILOT_CONFIG_PATH: ${{ inputs.config-path }}
        DRIFTPILOT_MODE: ${{ inputs.mode }}
        DRIFTPILOT_LLM_PROVIDER: ${{ inputs.llm-provider }}
        DRIFTPILOT_LLM_MODEL: ${{ inputs.llm-model }}
        DRIFTPILOT_LLM_API_KEY: ${{ inputs.llm-api-key }}
        DRIFTPILOT_GITHUB_TOKEN: ${{ inputs.github-token }}
        DRIFTPILOT_HISTORY_BRANCH: ${{ inputs.history-branch }}
        DRIFTPILOT_DASHBOARD_REPO: ${{ inputs.dashboard-repo }}
        DRIFTPILOT_DASHBOARD_TOKEN: ${{ inputs.dashboard-token }}
        GITHUB_TOKEN: ${{ inputs.provider-token }}
      run: driftpilot action
