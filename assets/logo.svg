<svg xmlns="http://www.w3.org/2000/svg" width="440" height="120" viewBox="0 0 440 120" role="img" aria-label="DriftPilot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#bg)"/>
  <!-- drifting water -->
  <path d="M22 86 q10 -9 20 0 t20 0 t20 0 t20 0" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <path d="M22 99 q10 -9 20 0 t20 0 t20 0 t20 0" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round"/>
  <!-- compass -->
  <circle cx="60" cy="44" r="25" fill="none" stroke="#ffffff" stroke-width="5"/>
  <path d="M60 23 L69 46 L60 41 L51 46 Z" fill="#ffffff"/>
  <path d="M60 65 L51 42 L60 47 L69 42 Z" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="60" cy="44" r="3.5" fill="#1f6feb"/>
  <!-- wordmark: mid-tone colours read on both light and dark backgrounds -->
  <text x="134" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" letter-spacing="-1" fill="#1f6feb">Drift<tspan fill="#0d9488">Pilot</tspan></text>
</svg>
