# DriftPilot default rule pack v1.
#
# Each rule: match (resource type / attribute globs, change kind) + optional `when` predicate -> verdict.
# Globs: `*` matches anything; every other character is literal (so `[0]` is literal).
# First matching rule wins, so noise rules come first. Findings no rule matches go to LLM triage.
#
# Predicates: null_to_default, list_reordered, json_equal, decreased,
#             changed_to: <value>, open_cidr_on_admin_port, json_wildcard_principal, iam_wildcard
#
# `never_soften:` (end of file) lists security weakenings that an LLM verdict may never play down:
# if the LLM calls one of them "not real", lower than `floor_severity`, or "codify"/"ignore", the policy
# step overrides it to real, at least the floor, action revert. Entries use the same match/when syntax as rules.

version: 1

# Attributes a normal `terraform apply` can't put back in place: reverting them needs
# `terraform apply -replace=<address>` (found in Phase 0: Docker treats cpu_shares=0 as "unchanged").
revert_with_replace:
  - { type: docker_container, attribute: cpu_shares }

rules:
  # ---------- Noise: not real drift ----------
  - id: noise-provider-defaults
    description: Provider fills in a zero default (null -> [] / {} / "" / 0 / false) on refresh, usually right after apply.
    match: { type: "*", attribute: "*", change_kind: modified }
    when: null_to_default
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.95
      reason: The provider filled in an empty default value; nothing was changed by a person.

  - id: noise-etag
    description: HTTP caching fingerprint returned by the API, not configuration.
    match: { type: "*", attribute: "etag" }
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.99
      reason: The etag is a caching fingerprint from the API, not a setting.

  - id: noise-docker-network-data
    description: Runtime network info (IP, gateway, MAC) changes whenever a container restarts.
    match: { type: docker_container, attribute: "network_data*" }
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.95
      reason: Network addresses are assigned at runtime and change on every container restart.

  - id: noise-list-reordered
    description: Same list members in a different order.
    match: { type: "*", attribute: "*", change_kind: modified }
    when: list_reordered
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.9
      reason: The list has the same members in a different order.

  - id: noise-json-equivalent
    description: JSON documents (e.g. policies) equal after normalising whitespace and key order.
    match: { type: "*", attribute: "*", change_kind: modified }
    when: json_equal
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.95
      reason: The JSON document is unchanged apart from formatting or key order.

  # ---------- Critical / high: real, dangerous drift ----------
  - id: github-branch-protection-deleted
    description: Branch protection removed outside Terraform.
    match: { type: "github_branch_protection*", change_kind: deleted }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: Branch protection was deleted, so anyone with write access can push straight to the branch.

  - id: github-required-approvals-reduced
    description: Fewer required pull request approvals than the code says.
    match: { type: "github_branch_protection*", attribute: "*required_approving_review_count" }
    when: decreased
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: Required pull request approvals were lowered, so changes can merge with less review.

  # Repository rulesets: GitHub's newer branch protection (used e.g. by the Cloud Posse module).
  # Added after the second-repo test: the classic-protection rules above don't match them.
  - id: github-ruleset-deleted
    description: A repository ruleset removed outside Terraform.
    match: { type: github_repository_ruleset, change_kind: deleted }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: A branch ruleset was deleted, so the protections it enforced no longer apply.

  - id: github-ruleset-approvals-reduced
    description: Fewer required pull request approvals in a ruleset.
    match: { type: github_repository_ruleset, attribute: "*required_approving_review_count" }
    when: decreased
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: The ruleset's required approvals were lowered, so changes can merge with less review.

  - id: github-ruleset-deletion-allowed
    description: Ruleset no longer blocks deleting the branch.
    match: { type: github_repository_ruleset, attribute: "rules*.deletion" }
    when: { changed_to: false }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: The ruleset no longer blocks deleting the protected branch.

  - id: github-ruleset-force-push-allowed
    description: Ruleset no longer blocks force pushes.
    match: { type: github_repository_ruleset, attribute: "rules*.non_fast_forward" }
    when: { changed_to: false }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: The ruleset no longer blocks force pushes, so history on the branch can be rewritten.

  - id: github-ruleset-disabled
    description: Ruleset switched off.
    match: { type: github_repository_ruleset, attribute: enforcement }
    when: { changed_to: disabled }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: The ruleset was disabled, so none of its protections are enforced.

  - id: github-ruleset-evaluate-only
    description: Ruleset switched to report-only.
    match: { type: github_repository_ruleset, attribute: enforcement }
    when: { changed_to: evaluate }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: The ruleset only reports now ("evaluate"), so nothing it checks is actually blocked.

  # SPEC §4.4 lists this under critical rules; the §7 scenario table (used as eval labels) says high.
  - id: github-team-permission-admin
    description: A team was given admin on a repository.
    match: { type: github_team_repository, attribute: permission }
    when: { changed_to: admin }
    verdict:
      is_real_drift: true
      severity: high
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: A team was raised to admin, which lets its members change settings and protections.

  - id: open-cidr-on-admin-port
    description: SSH (22) or RDP (3389) opened to the whole internet.
    match: { type: "aws_*security_group*", attribute: "*" }
    when: open_cidr_on_admin_port
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: An admin port (SSH or RDP) is now open to 0.0.0.0/0, the whole internet.


# Security weakenings the LLM may not soften (guardrail, see triage/policy.py). Each entry: match (type,
# attribute, change_kind) + optional `when` predicate + the lowest severity the verdict may have.
never_soften:
  # ---------- GitHub ----------
  - { type: "github_branch_protection*", change_kind: deleted, floor_severity: critical,
      reason: branch protection was deleted }
  - { type: "github_branch_protection*", attribute: "*required_approving_review_count", when: decreased,
      floor_severity: critical, reason: required pull request approvals were lowered }
  - { type: "github_branch_protection*", attribute: allows_force_pushes, when: { changed_to: true },
      floor_severity: critical, reason: force pushes were allowed on a protected branch }
  - { type: "github_branch_protection*", attribute: allows_deletions, when: { changed_to: true },
      floor_severity: critical, reason: deleting a protected branch was allowed }
  - { type: github_repository_ruleset, change_kind: deleted, floor_severity: critical,
      reason: a branch ruleset was deleted }
  - { type: github_repository_ruleset, attribute: "*required_approving_review_count", when: decreased,
      floor_severity: critical, reason: required approvals in a ruleset were lowered }
  - { type: github_repository_ruleset, attribute: "rules*.deletion", when: { changed_to: false },
      floor_severity: critical, reason: a ruleset no longer blocks deleting the branch }
  - { type: github_repository_ruleset, attribute: "rules*.non_fast_forward", when: { changed_to: false },
      floor_severity: critical, reason: a ruleset no longer blocks force pushes }
  - { type: github_repository_ruleset, attribute: enforcement, when: { changed_to: disabled },
      floor_severity: critical, reason: a ruleset was switched off }
  - { type: github_repository_ruleset, attribute: enforcement, when: { changed_to: evaluate },
      floor_severity: critical, reason: a ruleset was switched to report-only }
  - { type: github_team_repository, attribute: permission, when: { changed_to: admin },
      floor_severity: high, reason: a team was granted admin access }
  - { type: github_repository_collaborator, attribute: permission, when: { changed_to: admin },
      floor_severity: high, reason: a user was granted admin access }

  # ---------- AWS ----------
  - { type: "aws_*security_group*", attribute: "*", when: open_cidr_on_admin_port,
      floor_severity: critical, reason: an admin port is open to 0.0.0.0/0 }
  - { type: aws_s3_bucket_public_access_block, attribute: block_public_acls, when: { changed_to: false },
      floor_severity: critical, reason: S3 public access block turned off (block_public_acls) }
  - { type: aws_s3_bucket_public_access_block, attribute: block_public_policy, when: { changed_to: false },
      floor_severity: critical, reason: S3 public access block turned off (block_public_policy) }
  - { type: aws_s3_bucket_public_access_block, attribute: ignore_public_acls, when: { changed_to: false },
      floor_severity: critical, reason: S3 public access block turned off (ignore_public_acls) }
  - { type: aws_s3_bucket_public_access_block, attribute: restrict_public_buckets, when: { changed_to: false },
      floor_severity: critical, reason: S3 public access block turned off (restrict_public_buckets) }
  - { type: aws_s3_bucket_policy, attribute: policy, when: json_wildcard_principal,
      floor_severity: critical, reason: a bucket policy now allows any principal ("*") }
  - { type: "aws_iam_*policy", attribute: policy, when: iam_wildcard,
      floor_severity: critical, reason: an IAM policy now allows a wildcard action or resource }
  - { type: aws_db_instance, attribute: storage_encrypted, when: { changed_to: false },
      floor_severity: critical, reason: database storage encryption was turned off }
  - { type: aws_rds_cluster, attribute: storage_encrypted, when: { changed_to: false },
      floor_severity: critical, reason: database storage encryption was turned off }
  - { type: aws_ebs_volume, attribute: encrypted, when: { changed_to: false },
      floor_severity: critical, reason: volume encryption was turned off }
  - { type: "aws_s3_bucket_server_side_encryption_configuration", change_kind: deleted,
      floor_severity: critical, reason: bucket encryption configuration was removed }
  - { type: aws_db_instance, attribute: publicly_accessible, when: { changed_to: true },
      floor_severity: critical, reason: a database was made publicly accessible }
  - { type: aws_rds_cluster_instance, attribute: publicly_accessible, when: { changed_to: true },
      floor_severity: critical, reason: a database was made publicly accessible }
  - { type: aws_cloudtrail, attribute: enable_logging, when: { changed_to: false },
      floor_severity: critical, reason: CloudTrail logging was turned off }

  # ---------- Postgres (added in the database phase) ----------
  # Row-level security off, a policy dropped, a grant to PUBLIC: types pg_table_rls, pg_policy, pg_grant.
