# DriftPilot default rule pack v1.
#
# Each rule: match (resource type / attribute globs, change kind) + optional `when` predicate -> verdict.
# Globs: `*` matches anything; every other character is literal (so `[0]` is literal).
# First matching rule wins, so noise rules come first. Findings no rule matches go to LLM triage.
#
# Predicates: null_to_default, list_reordered, json_equal, decreased,
#             changed_to: <value>, open_cidr_on_admin_port, json_wildcard_principal, iam_wildcard,
#             tags_all_mirrors_tags, pii_name, policy_loosened (the last two are for Postgres)
#
# `controls:` (optional, on a rule or a never_soften entry) = DESCRIPTIVE compliance tags shown in issues and the
# job summary: public-storage, network-exposure, least-privilege, encryption-at-rest, audit-logging, code-review,
# backup, data-integrity (database constraints), pii (personal data). They are NOT CIS / SOC 2 control numbers: those must be checked against the primary texts first
# (open item for Shrey) before anyone names them here.
#
# `never_soften:` (end of file) lists security weakenings that an LLM verdict may never play down:
# if the LLM calls one of them "not real", lower than `floor_severity`, or "codify"/"ignore", the policy
# step overrides it to real, at least the floor, action revert. Entries use the same match/when syntax as rules.

version: 1

# Attributes a normal `terraform apply` can't put back in place: reverting them needs
# `terraform apply -replace=<address>` (found in Phase 0: Docker treats cpu_shares=0 as "unchanged").
revert_with_replace:
  - { type: docker_container, attribute: cpu_shares }

rules:
  # ---------- Noise: not real drift ----------
  - id: noise-provider-defaults
    description: Provider fills in a zero default (null -> [] / {} / "" / 0 / false) on refresh, usually right after apply.
    match: { type: "*", attribute: "*", change_kind: modified }
    when: null_to_default
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.95
      reason: The provider filled in an empty default value; nothing was changed by a person.

  - id: noise-etag
    description: HTTP caching fingerprint returned by the API, not configuration.
    match: { type: "*", attribute: "etag" }
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.99
      reason: The etag is a caching fingerprint from the API, not a setting.

  - id: noise-docker-network-data
    description: Runtime network info (IP, gateway, MAC) changes whenever a container restarts.
    match: { type: docker_container, attribute: "network_data*" }
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.95
      reason: Network addresses are assigned at runtime and change on every container restart.

  - id: noise-list-reordered
    description: Same list members in a different order.
    match: { type: "*", attribute: "*", change_kind: modified }
    when: list_reordered
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.9
      reason: The list has the same members in a different order.

  - id: noise-json-equivalent
    description: JSON documents (e.g. policies) equal after normalising whitespace and key order.
    match: { type: "*", attribute: "*", change_kind: modified }
    when: json_equal
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.95
      reason: The JSON document is unchanged apart from formatting or key order.

  # AWS provider behaviour (checked against the provider's resource docs): `tags_all` is "tags assigned to the
  # resource, including those inherited from the provider default_tags", so a tag change shows up twice.
  - id: noise-aws-tags-all-mirror
    description: tags_all changed exactly like tags (the provider copies tags into tags_all).
    match: { type: "aws_*", attribute: "tags_all*", change_kind: modified }
    when: tags_all_mirrors_tags
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.95
      reason: tags_all repeats the change already reported on tags; the provider copies tags into it.

  # aws_db_instance docs: latest_restorable_time is "the latest time to which a database can be restored with
  # point-in-time restore", so it moves forward on every refresh while backups run.
  - id: noise-aws-rds-latest-restorable-time
    description: RDS point-in-time-restore timestamp advances by itself.
    match: { type: aws_db_instance, attribute: latest_restorable_time }
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.99
      reason: The restorable-time stamp advances continuously while backups run; it is not a setting.

  # ---------- Critical / high: real, dangerous drift ----------
  - id: github-branch-protection-deleted
    description: Branch protection removed outside Terraform.
    controls: [code-review]
    match: { type: "github_branch_protection*", change_kind: deleted }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: Branch protection was deleted, so anyone with write access can push straight to the branch.

  - id: github-required-approvals-reduced
    description: Fewer required pull request approvals than the code says.
    controls: [code-review]
    match: { type: "github_branch_protection*", attribute: "*required_approving_review_count" }
    when: decreased
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: Required pull request approvals were lowered, so changes can merge with less review.

  # Repository rulesets: GitHub's newer branch protection (used e.g. by the Cloud Posse module).
  # Added after the second-repo test: the classic-protection rules above don't match them.
  - id: github-ruleset-deleted
    description: A repository ruleset removed outside Terraform.
    controls: [code-review]
    match: { type: github_repository_ruleset, change_kind: deleted }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: A branch ruleset was deleted, so the protections it enforced no longer apply.

  - id: github-ruleset-approvals-reduced
    description: Fewer required pull request approvals in a ruleset.
    controls: [code-review]
    match: { type: github_repository_ruleset, attribute: "*required_approving_review_count" }
    when: decreased
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: The ruleset's required approvals were lowered, so changes can merge with less review.

  - id: github-ruleset-deletion-allowed
    description: Ruleset no longer blocks deleting the branch.
    controls: [code-review]
    match: { type: github_repository_ruleset, attribute: "rules*.deletion" }
    when: { changed_to: false }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: The ruleset no longer blocks deleting the protected branch.

  - id: github-ruleset-force-push-allowed
    description: Ruleset no longer blocks force pushes.
    controls: [code-review]
    match: { type: github_repository_ruleset, attribute: "rules*.non_fast_forward" }
    when: { changed_to: false }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: The ruleset no longer blocks force pushes, so history on the branch can be rewritten.

  - id: github-ruleset-disabled
    description: Ruleset switched off.
    controls: [code-review]
    match: { type: github_repository_ruleset, attribute: enforcement }
    when: { changed_to: disabled }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: The ruleset was disabled, so none of its protections are enforced.

  - id: github-ruleset-evaluate-only
    description: Ruleset switched to report-only.
    controls: [code-review]
    match: { type: github_repository_ruleset, attribute: enforcement }
    when: { changed_to: evaluate }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: The ruleset only reports now ("evaluate"), so nothing it checks is actually blocked.

  # SPEC §4.4 lists this under critical rules; the §7 scenario table (used as eval labels) says high.
  - id: github-team-permission-admin
    description: A team was given admin on a repository.
    controls: [least-privilege]
    match: { type: github_team_repository, attribute: permission }
    when: { changed_to: admin }
    verdict:
      is_real_drift: true
      severity: high
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: A team was raised to admin, which lets its members change settings and protections.

  - id: open-cidr-on-admin-port
    description: SSH (22) or RDP (3389) opened to the whole internet.
    controls: [network-exposure]
    match: { type: "aws_*security_group*", attribute: "*" }
    when: open_cidr_on_admin_port
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: An admin port (SSH or RDP) is now open to 0.0.0.0/0, the whole internet.


  # ---------- AWS ----------
  - id: aws-s3-public-access-block-off
    description: An S3 public access block flag was switched off.
    controls: [public-storage]
    match: { type: "aws_s3_*public_access_block", attribute: "*public*", change_kind: modified }
    when: { changed_to: false }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: An S3 public access block setting was turned off, so a bucket can be made public by a policy or ACL.

  - id: aws-s3-bucket-policy-wildcard-principal
    description: A bucket policy now lets any principal in.
    controls: [public-storage, least-privilege]
    match: { type: aws_s3_bucket_policy, attribute: policy }
    when: json_wildcard_principal
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: The bucket policy now allows any principal ("*"), which can make the bucket public.

  - id: aws-iam-policy-wildcard
    description: An IAM policy now allows a wildcard action or resource.
    controls: [least-privilege]
    match: { type: "aws_iam_*policy", attribute: policy }
    when: iam_wildcard
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: The IAM policy now allows Action "*" or Resource "*", far more access than a least-privilege policy.

  - id: aws-publicly-accessible-on
    description: A database was made reachable from the internet.
    controls: [network-exposure]
    match: { type: "aws_*", attribute: publicly_accessible, change_kind: modified }
    when: { changed_to: true }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: The resource was made publicly accessible, so it can be reached from the internet.

  - id: aws-storage-encryption-off
    description: Storage encryption was turned off on a database or cluster.
    controls: [encryption-at-rest]
    match: { type: "aws_*", attribute: storage_encrypted, change_kind: modified }
    when: { changed_to: false }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: Storage encryption is now off, so data at rest is no longer encrypted.

  - id: aws-ebs-encryption-off
    description: An EBS volume is no longer encrypted.
    controls: [encryption-at-rest]
    match: { type: aws_ebs_volume, attribute: encrypted, change_kind: modified }
    when: { changed_to: false }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: The volume is no longer encrypted, so data at rest is unprotected.

  - id: aws-s3-encryption-config-deleted
    description: A bucket encryption configuration was removed.
    controls: [encryption-at-rest]
    match: { type: aws_s3_bucket_server_side_encryption_configuration, change_kind: deleted }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: The bucket encryption configuration was deleted outside Terraform.

  - id: aws-cloudtrail-logging-off
    description: CloudTrail logging was stopped.
    controls: [audit-logging]
    match: { type: aws_cloudtrail, attribute: enable_logging, change_kind: modified }
    when: { changed_to: false }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: CloudTrail logging was turned off, so API activity is no longer recorded.

  - id: aws-backup-retention-decreased
    description: Backups are kept for fewer days than the code says.
    controls: [backup]
    match: { type: "aws_*", attribute: backup_retention_period, change_kind: modified }
    when: decreased
    verdict:
      is_real_drift: true
      severity: high
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: The backup retention period was lowered, so there are fewer restore points.

  - id: aws-deletion-protection-off
    description: Deletion protection was switched off.
    controls: [backup]
    match: { type: "aws_*", attribute: deletion_protection, change_kind: modified }
    when: { changed_to: false }
    verdict:
      is_real_drift: true
      severity: high
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: Deletion protection is off, so the database can be deleted by one call.

  - id: aws-ec2-public-ip
    description: An EC2 instance gets a public IP address.
    controls: [network-exposure]
    match: { type: aws_instance, attribute: associate_public_ip_address, change_kind: modified }
    when: { changed_to: true }
    verdict:
      is_real_drift: true
      severity: high
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.85
      reason: The instance now has a public IP address and can be reached from the internet.


  # ---------- Postgres (database schema drift) ----------
  # Resource types: pg_table, pg_column, pg_constraint, pg_index, pg_policy, pg_grant, pg_table_rls.
  # `before` is what the migration files build, `after` is the live database. change_kind `added`
  # = only the live database has it; `deleted` = the migrations have it but the live database lost it.
  - id: pg-noise-owner
    description: Only the table owner differs (scratch databases are owned by another role).
    match: { type: pg_table, attribute: owner }
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.9
      reason: Only the owner role differs; the migration run uses another role than the live database.

  - id: pg-noise-comment
    description: Only a comment differs.
    match: { type: "pg_*", attribute: comment }
    verdict:
      is_real_drift: false
      severity: none
      category: cosmetic
      intent: likely_automation
      recommended_action: none
      confidence: 0.9
      reason: Only a comment on the object differs; the schema behaves the same.

  - id: pg-rls-disabled
    description: Row-level security was switched off on a table.
    controls: [least-privilege]
    match: { type: pg_table_rls, attribute: row_level_security, change_kind: modified }
    when: { changed_to: false }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: Row-level security is off, so every role with table access can read and change every row.

  - id: pg-policy-dropped
    description: A row-level security policy is missing from the live database.
    controls: [least-privilege]
    match: { type: pg_policy, change_kind: deleted }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: A row-level security policy was dropped, so rows it protected are no longer restricted.

  - id: pg-policy-loosened
    description: A row-level security policy now lets more rows through.
    controls: [least-privilege]
    match: { type: pg_policy }
    when: policy_loosened
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: A row-level security policy was added or changed so that it lets more rows through (for example USING true).

  - id: pg-grant-to-public
    description: A privilege was granted to PUBLIC (every role).
    controls: [least-privilege]
    match: { type: pg_grant, attribute: "grant:PUBLIC:*", change_kind: added }
    verdict:
      is_real_drift: true
      severity: critical
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.95
      reason: A privilege on the table was granted to PUBLIC, so every database role has it.

  - id: pg-rls-force-off
    description: FORCE ROW LEVEL SECURITY was switched off, so the table owner bypasses the policies.
    controls: [least-privilege]
    match: { type: pg_table_rls, attribute: force_row_level_security, change_kind: modified }
    when: { changed_to: false }
    verdict:
      is_real_drift: true
      severity: high
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.85
      reason: Row-level security is no longer forced, so the table owner can bypass its policies.

  - id: pg-rls-enabled
    description: Row-level security is on in the live database but the migrations do not turn it on.
    controls: [least-privilege]
    match: { type: pg_table_rls, attribute: row_level_security, change_kind: modified }
    when: { changed_to: true }
    verdict:
      is_real_drift: true
      severity: medium
      category: security
      intent: likely_hotfix
      recommended_action: codify
      confidence: 0.8
      reason: Row-level security was switched on by hand; it is stricter, so keep it and add it to the migrations.

  - id: pg-not-null-dropped
    description: A NOT NULL rule was removed from a column.
    controls: [data-integrity]
    match: { type: pg_column, attribute: nullable, change_kind: modified }
    when: { changed_to: true }
    verdict:
      is_real_drift: true
      severity: high
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.85
      reason: The column accepts NULL again, so rows can be saved without a value the application relies on.

  - id: pg-constraint-dropped
    description: A primary key, foreign key, unique or check constraint is missing from the live database.
    controls: [data-integrity]
    match: { type: pg_constraint, change_kind: deleted }
    verdict:
      is_real_drift: true
      severity: high
      category: security
      intent: unknown
      recommended_action: revert
      confidence: 0.9
      reason: A constraint was dropped, so the database no longer stops duplicate, orphaned or invalid rows.

  - id: pg-pii-column-added
    description: A column whose name suggests personal data exists only in the live database.
    controls: [pii]
    match: { type: pg_column, change_kind: added }
    when: pii_name
    verdict:
      is_real_drift: true
      severity: high
      category: security
      intent: unknown
      recommended_action: investigate
      confidence: 0.85
      reason: A column that looks like personal data was added by hand, with no migration, review or access plan.

  - id: pg-grant-added
    description: A privilege was granted to a role that the migrations do not grant.
    controls: [least-privilege]
    match: { type: pg_grant, change_kind: added }
    verdict:
      is_real_drift: true
      severity: medium
      category: security
      intent: unknown
      recommended_action: investigate
      confidence: 0.8
      reason: A role has a privilege on the table that no migration grants.

  - id: pg-grant-revoked
    description: A privilege the migrations grant is missing in the live database.
    controls: [least-privilege]
    match: { type: pg_grant, change_kind: deleted }
    verdict:
      is_real_drift: true
      severity: medium
      category: availability
      intent: unknown
      recommended_action: revert
      confidence: 0.8
      reason: A role lost a privilege the migrations give it, so its queries can start failing.

  - id: pg-extra-table
    description: A table exists only in the live database.
    match: { type: pg_table, change_kind: added }
    verdict:
      is_real_drift: true
      severity: medium
      category: availability
      intent: unknown
      recommended_action: codify
      confidence: 0.75
      reason: The live database has a table no migration creates; add a migration so a rebuild keeps it.

  - id: pg-extra-column
    description: A column exists only in the live database.
    match: { type: pg_column, change_kind: added }
    verdict:
      is_real_drift: true
      severity: medium
      category: availability
      intent: likely_hotfix
      recommended_action: codify
      confidence: 0.75
      reason: The live database has a column no migration adds; add a migration so a rebuild keeps it.

  - id: pg-index-dropped
    description: An index from the migrations is missing in the live database.
    match: { type: pg_index, change_kind: deleted }
    verdict:
      is_real_drift: true
      severity: medium
      category: availability
      intent: unknown
      recommended_action: revert
      confidence: 0.8
      reason: An index was dropped, so queries that used it can become slow.

  - id: pg-column-type-changed
    description: A column has another type than the migrations give it.
    match: { type: pg_column, attribute: type, change_kind: modified }
    verdict:
      is_real_drift: true
      severity: medium
      category: availability
      intent: unknown
      recommended_action: investigate
      confidence: 0.8
      reason: The column type differs from the migrations; a person should decide which one is right.


# Security weakenings the LLM may not soften (guardrail, see triage/policy.py). Each entry: match (type,
# attribute, change_kind) + optional `when` predicate + the lowest severity the verdict may have.
never_soften:
  # ---------- GitHub ----------
  - { type: "github_branch_protection*", change_kind: deleted, floor_severity: critical,
      reason: branch protection was deleted,
      controls: [code-review] }
  - { type: "github_branch_protection*", attribute: "*required_approving_review_count", when: decreased,
      floor_severity: critical, reason: required pull request approvals were lowered,
      controls: [code-review] }
  - { type: "github_branch_protection*", attribute: allows_force_pushes, when: { changed_to: true },
      floor_severity: critical, reason: force pushes were allowed on a protected branch,
      controls: [code-review] }
  - { type: "github_branch_protection*", attribute: allows_deletions, when: { changed_to: true },
      floor_severity: critical, reason: deleting a protected branch was allowed,
      controls: [code-review] }
  - { type: github_repository_ruleset, change_kind: deleted, floor_severity: critical,
      reason: a branch ruleset was deleted,
      controls: [code-review] }
  - { type: github_repository_ruleset, attribute: "*required_approving_review_count", when: decreased,
      floor_severity: critical, reason: required approvals in a ruleset were lowered,
      controls: [code-review] }
  - { type: github_repository_ruleset, attribute: "rules*.deletion", when: { changed_to: false },
      floor_severity: critical, reason: a ruleset no longer blocks deleting the branch,
      controls: [code-review] }
  - { type: github_repository_ruleset, attribute: "rules*.non_fast_forward", when: { changed_to: false },
      floor_severity: critical, reason: a ruleset no longer blocks force pushes,
      controls: [code-review] }
  - { type: github_repository_ruleset, attribute: enforcement, when: { changed_to: disabled },
      floor_severity: critical, reason: a ruleset was switched off,
      controls: [code-review] }
  - { type: github_repository_ruleset, attribute: enforcement, when: { changed_to: evaluate },
      floor_severity: critical, reason: a ruleset was switched to report-only,
      controls: [code-review] }
  - { type: github_team_repository, attribute: permission, when: { changed_to: admin },
      floor_severity: high, reason: a team was granted admin access,
      controls: [least-privilege] }
  - { type: github_repository_collaborator, attribute: permission, when: { changed_to: admin },
      floor_severity: high, reason: a user was granted admin access,
      controls: [least-privilege] }

  # ---------- AWS ----------
  - { type: "aws_*security_group*", attribute: "*", when: open_cidr_on_admin_port,
      floor_severity: critical, reason: an admin port is open to 0.0.0.0/0,
      controls: [network-exposure] }
