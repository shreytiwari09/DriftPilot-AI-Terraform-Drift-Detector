# Azure-style resources (azurerm provider), hand-built plan JSON (no Azure account needed; detection reads plan JSON
# the same way). They mirror the hand changes in demo/azure/RUNBOOK.md and a few look-alikes.
# Labels written from the rubric in README.md before any configuration was scored.

- id: azure-storage-blob-public-access-allowed
  source: synthetic
  code: |
    resource "azurerm_storage_account" "demo" {
      name                            = "dpdemoa1b2c3d4"
      resource_group_name             = "rg-demo"
      location                        = "centralindia"
      account_tier                    = "Standard"
      account_replication_type        = "LRS"
      allow_nested_items_to_be_public = false
    }
  drift:
    - address: azurerm_storage_account.demo
      before: {name: dpdemoa1b2c3d4, account_tier: Standard, allow_nested_items_to_be_public: false}
      after: {name: dpdemoa1b2c3d4, account_tier: Standard, allow_nested_items_to_be_public: true}
  expect:
    - attribute: allow_nested_items_to_be_public
      real: true
      severity: critical
      action: [revert]

