- id: azure-storage-tag-edited
  source: synthetic
  code: |
    resource "azurerm_storage_account" "demo" {
      name                     = "dpdemoa1b2c3d4"
      resource_group_name      = "rg-demo"
      location                 = "centralindia"
      account_tier             = "Standard"
      account_replication_type = "LRS"
      tags = {
        demo = "driftpilot"
        team = "platform"
      }
    }
  drift:
    - address: azurerm_storage_account.demo
      before: {name: dpdemoa1b2c3d4, tags: {demo: driftpilot, team: platform}}
      after: {name: dpdemoa1b2c3d4, tags: {demo: driftpilot, team: data-platform}}
  expect:
    - attribute: tags.team
      real: true
      severity: low
      action: [codify, ignore_changes]

