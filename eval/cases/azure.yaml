- id: azure-nsg-ssh-rule-added-from-any
  source: synthetic
  code: |
    resource "azurerm_network_security_group" "demo" {
      name                = "nsg-demo"
      location            = "centralindia"
      resource_group_name = "rg-demo"
      security_rule {
        name                       = "ssh-from-my-ip"
        priority                   = 100
        direction                  = "Inbound"
        access                     = "Allow"
        protocol                   = "Tcp"
        source_port_range          = "*"
        destination_port_range     = "22"
        source_address_prefix      = "203.0.113.7/32"
        destination_address_prefix = "*"
      }
    }
  drift:
    - address: azurerm_network_security_group.demo
      before:
        name: nsg-demo
        security_rule:
          - {name: ssh-from-my-ip, priority: 100, direction: Inbound, access: Allow, protocol: Tcp, source_port_range: "*", destination_port_range: "22", source_address_prefix: 203.0.113.7/32, destination_address_prefix: "*"}
      after:
        name: nsg-demo
        security_rule:
          - {name: ssh-from-my-ip, priority: 100, direction: Inbound, access: Allow, protocol: Tcp, source_port_range: "*", destination_port_range: "22", source_address_prefix: 203.0.113.7/32, destination_address_prefix: "*"}
          - {name: portal-ssh-any, priority: 110, direction: Inbound, access: Allow, protocol: Tcp, source_port_range: "*", destination_port_range: "22", source_address_prefix: "*", destination_address_prefix: "*"}
  expect:
    - attribute: security_rule
      real: true
      severity: critical
      action: [revert]

