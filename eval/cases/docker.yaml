# Variants of the Docker scenarios.

- id: docker-web-memory-lowered
  source: synthetic
  scenario: 11
  code_dir: demo/docker
  drift:
    - address: docker_container.web
      before: {name: driftpilot-demo-web, memory: 256, memory_swap: 512}
      after: {name: driftpilot-demo-web, memory: 128, memory_swap: 256}
  expect:
    - attribute: memory
      real: true
      severity: medium
      action: [revert, codify, investigate]
    - attribute: memory_swap
      real: true
      severity: medium
      action: [revert, codify, investigate]

