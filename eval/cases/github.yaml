# Variants of the GitHub scenarios: other values, increases vs decreases, other settings.

- id: gh-approvals-2-to-1
  source: synthetic
  scenario: 2
  code_dir: demo/github
  drift:
    - address: github_branch_protection.api_main
      before: {pattern: main, required_pull_request_reviews: [{required_approving_review_count: 2}]}
      after: {pattern: main, required_pull_request_reviews: [{required_approving_review_count: 1}]}
  expect:
    - attribute: required_pull_request_reviews[0].required_approving_review_count
      real: true
      severity: critical
      action: [revert]

