  scenario: 2
  fixture: github/s2_required_approvals_reduced
  code_dir: demo/github
  expect:
    - attribute: required_pull_request_reviews[0].required_approving_review_count
      real: true
      severity: critical
      action: [revert]

- id: rec-gh-batch-a
  source: recorded
  scenario: [2, 3, 5, 6, 7, 8]
  fixture: github/batch_a_s2_s3_s5_s6_s7_s8
  code_dir: demo/github
  expect:
    - address: github_branch_protection.api_main
      attribute: required_pull_request_reviews[0].required_approving_review_count
      real: true
      severity: critical
      action: [revert]
    - address: github_branch_protection.api_main
      attribute: required_status_checks
      real: true
      severity: medium
      action: [codify]
    - address: github_repository.api
      attribute: description
      real: true
      severity: low
      action: [codify]
    - address: github_repository.api
      attribute: has_issues
      real: true
      severity: medium
      action: [codify, revert]
    - address: github_repository.api
      attribute: topics
      real: true
      severity: low
      action: [codify]
    - address: github_team_repository.developers_api
      attribute: permission
      real: true
      severity: high
      action: [revert, investigate]
    - address: github_team.developers
      attribute: etag
      real: false
      severity: none
      action: [none]
    - address: github_team_repository.developers_api
      attribute: etag
      real: false
      severity: none
      action: [none]

- id: rec-gh-batch-b
  source: recorded
  scenario: [1, 4]
  fixture: github/batch_b_s1_s4
  code_dir: demo/github
  expect:
    - address: github_branch_protection.api_main
      attribute: null
      real: true
      severity: critical
      action: [revert, recreate]
    - address: github_repository.web
      attribute: archived
      real: true
      severity: high
      action: [investigate, revert]
    - address: github_repository.web
      attribute: vulnerability_alerts
      real: true
      severity: critical
      action: [revert, investigate]
    - address: github_team_repository.developers_api
      attribute: etag
      real: false
      severity: none
      action: [none]

