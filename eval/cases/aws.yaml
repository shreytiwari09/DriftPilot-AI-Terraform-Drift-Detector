- id: aws-s3-tags-edited
  source: synthetic
  code: |
    resource "aws_s3_bucket" "logs" {
      bucket = "acme-logs"
      tags = {
        team = "platform"
      }
    }
  drift:
    - address: aws_s3_bucket.logs
      before: {bucket: acme-logs, tags: {team: platform}}
      after: {bucket: acme-logs, tags: {team: platform, cost-center: "1234"}}
  expect:
    - attribute: tags.cost-center
      real: true
      severity: low
      action: [codify, ignore_changes]

- id: aws-iam-policy-wildcard
  source: synthetic
  code: |
    resource "aws_iam_policy" "deploy" {
      name   = "deploy"
      policy = jsonencode({ Version = "2012-10-17", Statement = [{ Effect = "Allow", Action = ["s3:GetObject"], Resource = "arn:aws:s3:::acme-data/*" }] })
    }
  drift:
    - address: aws_iam_policy.deploy
      before: {name: deploy, policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":"arn:aws:s3:::acme-data/*"}]}'}
      after: {name: deploy, policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"*","Resource":"*"}]}'}
  expect:
    - attribute: policy
      real: true
      severity: critical
      action: [revert]

- id: aws-iam-policy-narrowed
  source: synthetic
  code: |
    resource "aws_iam_policy" "reader" {
      name   = "reader"
      policy = jsonencode({ Version = "2012-10-17", Statement = [{ Effect = "Allow", Action = ["s3:GetObject", "s3:ListBucket"], Resource = "*" }] })
    }
  drift:
    - address: aws_iam_policy.reader
      before: {name: reader, policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:ListBucket"],"Resource":"*"}]}'}
      after: {name: reader, policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":"*"}]}'}
  expect:
    - attribute: policy
      real: true
      severity: medium
      action: [codify, investigate]

