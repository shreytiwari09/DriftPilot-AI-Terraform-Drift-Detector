- id: aws-s3-public-access-block-off
  source: synthetic
  code: |
    resource "aws_s3_bucket_public_access_block" "data" {
      bucket                  = "acme-data"
      block_public_acls       = true
      block_public_policy     = true
      ignore_public_acls      = true
      restrict_public_buckets = true
    }
  drift:
    - address: aws_s3_bucket_public_access_block.data
      before: {bucket: acme-data, block_public_policy: true}
      after: {bucket: acme-data, block_public_policy: false}
  expect:
    - attribute: block_public_policy
      real: true
      severity: critical
      action: [revert]

- id: aws-s3-encryption-removed
  source: synthetic
  code: |
    resource "aws_s3_bucket_server_side_encryption_configuration" "data" {
      bucket = "acme-data"
      rule {
        apply_server_side_encryption_by_default {
          sse_algorithm = "aws:kms"
        }
      }
    }
  drift:
    - address: aws_s3_bucket_server_side_encryption_configuration.data
      actions: [delete]
      before: {bucket: acme-data}
      after: null
  expect:
    - attribute: null
      real: true
      severity: critical
      action: [revert, recreate]

- id: aws-s3-versioning-suspended
