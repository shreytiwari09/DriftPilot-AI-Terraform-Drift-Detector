# AWS-style resources, hand-built plan JSON (no AWS account needed; detection reads plan JSON the same way).

- id: aws-sg-ssh-opened-to-world
  source: synthetic
  code: |
    resource "aws_security_group" "admin" {
      name = "admin"
      ingress {
        from_port   = 22
        to_port     = 22
        protocol    = "tcp"
        cidr_blocks = ["10.0.0.0/8"]
      }
    }
  drift:
    - address: aws_security_group.admin
      before: {name: admin, ingress: [{from_port: 22, to_port: 22, protocol: tcp, cidr_blocks: [10.0.0.0/8]}]}
      after: {name: admin, ingress: [{from_port: 22, to_port: 22, protocol: tcp, cidr_blocks: [0.0.0.0/0]}]}
  expect:
    - attribute: ingress[0].cidr_blocks
      real: true
      severity: critical
      action: [revert]

